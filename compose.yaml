services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: filings
      POSTGRES_PASSWORD: filings
      POSTGRES_DB: filings
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filings"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
