# Same steps as scripts/check.ps1. No GPU and no Ollama here: the retrieval gate runs on the
# committed fixture corpus with precomputed chunk and question vectors.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: filings
          POSTGRES_PASSWORD: filings
          POSTGRES_DB: filings_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U filings" --health-interval 2s --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://filings:filings@localhost:5432/filings_test
      TEST_DATABASE_URL: postgresql://filings:filings@localhost:5432/filings_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy src tests scripts
      - name: Load fixture corpus
        run: uv run alembic upgrade head && uv run filings fixtures load
      - name: Tests
        run: uv run pytest -q
      - name: Retrieval gate
        run: uv run filings eval gate

  # Branch protection requires a status named "check". Matrix jobs report as "test (3.11)".
  check:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success
