[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goldirham-filings"
version = "0.2.0"
description = "Cited question answering over SEC filings, served over MCP"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "numpy>=2.0",
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "selectolax>=0.3.21",
    "sqlalchemy>=2.0",
]

[project.scripts]
filings = "goldirham_filings.cli:main"
goldirham-filings-mcp = "goldirham_filings.server:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/goldirham_filings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a Postgres with pgvector at TEST_DATABASE_URL"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PLE"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "sentence_transformers.*"]
ignore_missing_imports = true
